<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Prática de JavaScript</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark text-light d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4 col-xl-3">
                
                <!-- Card Principal da Calculadora -->
                <div class="card border-secondary shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-body-tertiary border-secondary text-center py-2">
                        <span class="fw-semibold text-secondary small">Santa Lúcia - Calculator</span>
                    </div>

                    <div class="card-body p-3">
                        <form id="calcForm" onsubmit="return false;">
                            
                            <!-- Visor da Calculadora -->
                            <div class="mb-3">
                                <input type="text" 
                                       id="display" 
                                       class="form-control form-control-lg text-end fs-2 fw-bold font-monospace bg-black text-light border-secondary py-3" 
                                       value="0" 
                                       readonly>
                            </div>

                            <!-- Teclado / Grid de Botões -->
                            <div class="row g-2">
                                <!-- Linha 1: Limpar, Backspace, Divisão -->
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-danger btn-lg w-100 fw-bold py-3" id="btnClear">C</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-outline-secondary btn-lg w-100 fw-bold py-3" id="btnBackspace">&larr;</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-warning btn-lg w-100 fw-bold py-3" data-op="/">&divide;</button>
                                </div>

                                <!-- Linha 2: 7, 8, 9, Multiplicação -->
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="7">7</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="8">8</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="9">9</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-warning btn-lg w-100 fw-bold py-3" data-op="*">&times;</button>
                                </div>

                                <!-- Linha 3: 4, 5, 6, Subtração -->
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="4">4</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="5">5</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="6">6</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-warning btn-lg w-100 fw-bold py-3" data-op="-">&minus;</button>
                                </div>

                                <!-- Linha 4: 1, 2, 3, Adição -->
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="1">1</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="2">2</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="3">3</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-warning btn-lg w-100 fw-bold py-3" data-op="+">+</button>
                                </div>

                                <!-- Linha 5: 0, Ponto, Igual -->
                                <div class="col-6">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num="0">0</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-secondary btn-lg w-100 fw-bold py-3" data-num=".">.</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-primary btn-lg w-100 fw-bold py-3" id="btnEquals">=</button>
                                </div>
                            </div>

                        </form>
                    </div>

                    <div class="card-footer bg-body-tertiary border-secondary text-center py-2 text-muted small">
                        Criaremos o <code>script.js</code>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Script da Aula -->
    <script src="script.js"></script>
</body>
</html>
